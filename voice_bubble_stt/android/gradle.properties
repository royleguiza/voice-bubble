org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m
android.useAndroidX=true
# C-02 CI: el plugin Flutter Gradle aun usa la DSL legada de AGP
# (AbstractAppExtension). AGP 9 la oculta por defecto (newDsl=true) y
# `gradle :app:testDebugUnitTest` falla al aplicar el plugin con
# ClassCastException (ApplicationExtensionImpl no convertible). El paso
# nativo invoca `gradle` directo (sin `flutter`, que inyectaria el flag),
# asi que se fija el opt-out documentado hasta que el plugin migre
# (AGP 10 lo elimina). Solo compatibilidad de build, sin cambio de
# conducta de la app. No agregar builtInKotlin=false: el proyecto usa el
# Kotlin integrado de AGP 9 (sin aplicar kotlin-android).
android.newDsl=false
