name: Android Debug APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard secretos versionados SPK-01
        run: |
          if git grep -nE 'github_pat_[A-Za-z0-9_]{10,}|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}' -- .; then
            echo '::error::posible secreto versionado SPK-01. Revoca el PAT y purga la historia.'
            exit 1
          fi
          if git ls-files | grep -xE '\.github_token|\.agents/secrets\.env'; then
            echo '::error::archivo de secretos trackeado SPK-01'
            exit 1
          fi

      - name: Contrato de claves del puente
        run: |
          KT=voice_bubble_stt/android/app/src/main/kotlin/com/royleguiza/voicebubblestt
          test -d "$KT" || { echo '::error::falta el arbol Kotlin versionado del teclado'; exit 1; }
          grep -rvhE '^[[:space:]]*import ' "$KT" \
            | grep -ohE 'flutter\.[a-z_0-9]+' \
            | sed 's/^flutter\.//' \
            | sort -u > /tmp/claves-kotlin.txt
          diff -u docs/contract-keys.txt /tmp/claves-kotlin.txt \
            || { echo '::error::paridad de claves Kotlin-Dart rota (fuente de verdad docs/contract-keys.txt)'; exit 1; }

      - name: Triángulo Dart del puente (SPK-07)
        run: |
          python3 - <<'EOF'
          import re
          dart = open('app_source/lib/services/storage_service.dart', encoding='utf-8').read()
          const_vals = dict(re.findall(r"static const String (\w+)\s*=\s*'([a-z_0-9]+)';", dart))
          m = re.search(r"static const List<String> bridgeKeys = \[(.*?)\];", dart, re.DOTALL)
          assert m, 'Falta StorageService.bridgeKeys'
          table = []
          for ident in re.findall(r'[A-Za-z_]\w*', m.group(1)):
              assert ident in const_vals, f'bridgeKeys referencia const inexistente: {ident}'
              table.append(const_vals[ident])
          expected = open('docs/contract-keys.txt', encoding='utf-8').read().strip()
          assert '\n'.join(sorted(table)) == expected, 'Discrepancia tabla Dart vs contrato'
          print('Triángulo Dart OK')
          EOF

      - name: Bóveda cifrada (SPK-02)
        run: |
          KT=voice_bubble_stt/android/app/src/main/kotlin/com/royleguiza/voicebubblestt
          grep -q 'EncryptedSharedPreferences' "$KT/SecureStore.kt" || { echo '::error::sin ESP en la bóveda'; exit 1; }
          grep -q 'SecureStore.read' "$KT/SpeechToTextClient.kt" || { echo '::error::dictado sin bóveda'; exit 1; }
          grep -q 'SecureStore.read' "$KT/CredentialStore.kt" || { echo '::error::claves sin bóveda'; exit 1; }
          if grep -rn 'setString(sttApiKeyMirrorKey\|setString(credPassKey' app_source/lib --include='*.dart'; then
            echo '::error::espejo plano de secretos prohibido (SPK-02)'
            exit 1
          fi
          grep -q 'androidx.security:security-crypto' voice_bubble_stt/android/app/build.gradle.kts || { echo '::error::sin security-crypto'; exit 1; }
          for xml in voice_bubble_stt/android/app/src/main/res/xml/backup_rules.xml voice_bubble_stt/android/app/src/main/res/xml/data_extraction_rules.xml; do
            grep -q '<exclude domain="sharedpref" path="FlutterSharedPreferences.xml" />' "$xml" || { echo "::error::sin excluir prefs en $xml"; exit 1; }
            grep -q '<exclude domain="sharedpref" path="FlutterSecureStorage.xml" />' "$xml" || { echo "::error::sin excluir bóveda en $xml"; exit 1; }
          done

      - name: Manifest anti-Play-Protect
        run: |
          python3 - <<'EOF'
          import re
          raw = open('voice_bubble_stt/android/app/src/main/AndroidManifest.xml', encoding='utf-8').read()
          decls = re.sub(r'<!--.*?-->', '', raw, flags=re.DOTALL)
          assert 'BIND_ACCESSIBILITY_SERVICE' not in decls, 'BIND_ACCESSIBILITY_SERVICE prohibido'
          assert 'VoiceBubbleAccessibilityService' not in decls, 'servicio dormido declarado'
          assert 'android:hasFragileUserData="true"' in decls, 'falta hasFragileUserData'
          assert 'android:allowBackup="true"' in decls, 'falta allowBackup'
          print('Manifest OK')
          EOF

      - name: Hex de colores valido
        run: |
          # || true semantico: filtro vacio (todo valido) termina con estado 1
          # bajo bash -e; el fallo real lo detecta el chequeo de BAD.
          BAD=$(grep -rnoE '<color name="[^"]+">[^<]+</color>' voice_bubble_stt/android/app/src/main/res/values* \
            | grep -vE '>(@[A-Za-z0-9_/]+|#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{4}|[0-9A-Fa-f]{6}|[0-9A-Fa-f]{8}))</color>$' || true)
          if [ -n "$BAD" ]; then
            echo "$BAD"
            echo '::error::hex invalido en colors.xml'
            exit 1
          fi

      - name: Sin contenido en Logs
        run: |
          if grep -rniE 'Log\.[a-z]+\(.*\b(texto|contenido|api_?key|token|password|contraseña|passwd|otp|tecleado|coordenada)\b' voice_bubble_stt/android/app/src/main/kotlin; then
            echo '::error::posible filtracion de contenido en Log'
            exit 1
          fi

      - name: Tokens UI (sin Colors.green ni TextStyle sueltos)
        run: |
          if grep -rn 'Colors\.green' app_source/lib --include='*.dart'; then
            echo '::error::Colors.green fuera de tokens (usar kSuccessLight/Dark)'
            exit 1
          fi
          if grep -rn 'TextStyle(' app_source/lib --include='*.dart' | grep -v 'design_tokens.dart' | grep -v 'AnimatedDefaultTextStyle'; then
            echo '::error::TextStyle fuera de tokens (usar kTextSelected/kTextUnselected/kTextMeta)'
            exit 1
          fi
          if grep -rhoE 'size: [0-9]+' app_source/lib --include='*.dart' | grep -vE 'size: (18|22|28)$'; then
            echo '::error::Icon size fuera de tabla SPK-15 (usar AppIcons 18/22/28)'
            exit 1
          fi

      - name: Java 17 (con cache de Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Aceptar licencias Android SDK (defensivo)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Flutter (stable + cache pub)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sincronizar fuente (app_source -> voice_bubble_stt)
        run: |
          cp app_source/pubspec.yaml app_source/analysis_options.yaml voice_bubble_stt/
          rm -rf voice_bubble_stt/lib voice_bubble_stt/test
          cp -r app_source/lib voice_bubble_stt/
          cp -r app_source/test voice_bubble_stt/

      - name: Pub get
        working-directory: voice_bubble_stt
        run: flutter pub get

      - name: Analyze estricto (infos y warnings fatales)
        working-directory: voice_bubble_stt
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        working-directory: voice_bubble_stt
        run: flutter test

      - name: Suites Python del repo (SPK-08)
        run: python3 test_master_suite.py

      - name: Guard archivos de teclado presentes
        run: |
          test -f voice_bubble_stt/android/app/src/main/res/xml/method.xml \
            || { echo '::error::falta method.xml'; exit 1; }
          grep -q 'VoiceKeyboardService' voice_bubble_stt/android/app/src/main/AndroidManifest.xml \
            || { echo '::error::IME no declarado en manifest'; exit 1; }
          test -f voice_bubble_stt/android/app/src/main/kotlin/com/royleguiza/voicebubblestt/SpeechToTextClient.kt \
            || { echo '::error::falta SpeechToTextClient.kt (K3)'; exit 1; }

      - name: Build APK debug (split por ABI)
        working-directory: voice_bubble_stt
        run: flutter build apk --debug --split-per-abi

      - name: Upload APK arm64
        uses: actions/upload-artifact@v4
        with:
          name: voice-bubble-arm64-debug-apk-r${{ github.run_number }}
          path: voice_bubble_stt/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
