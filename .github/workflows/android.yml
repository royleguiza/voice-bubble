name: Android Debug APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Contrato de claves del puente
        run: |
          KT=voice_bubble_stt/android/app/src/main/kotlin/com/royleguiza/voicebubblestt
          test -d "$KT" || { echo '::error::falta el arbol Kotlin versionado del teclado'; exit 1; }
          grep -rvhE '^[[:space:]]*import ' "$KT" \
            | grep -ohE 'flutter\.[a-z_0-9]+' \
            | sed 's/^flutter\.//' \
            | sort -u > /tmp/claves-kotlin.txt
          diff -u docs/contract-keys.txt /tmp/claves-kotlin.txt \
            || { echo '::error::paridad de claves Kotlin-Dart rota (fuente de verdad docs/contract-keys.txt)'; exit 1; }

      - name: Hex de colores valido
        run: |
          # || true semantico: filtro vacio (todo valido) termina con estado 1
          # bajo bash -e; el fallo real lo detecta el chequeo de BAD.
          BAD=$(grep -rnoE '<color name="[^"]+">[^<]+</color>' voice_bubble_stt/android/app/src/main/res/values* \
            | grep -vE '>(@[A-Za-z0-9_/]+|#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{4}|[0-9A-Fa-f]{6}|[0-9A-Fa-f]{8}))</color>$' || true)
          if [ -n "$BAD" ]; then
            echo "$BAD"
            echo '::error::hex invalido en colors.xml'
            exit 1
          fi

      - name: Sin contenido en Logs
        run: |
          if grep -rniE 'Log\.[a-z]+\(.*\b(texto|contenido|api_?key|token)\b' voice_bubble_stt/android/app/src/main/kotlin; then
            echo '::error::posible filtracion de contenido en Log'
            exit 1
          fi

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.3.1 reproducible
        uses: gradle/actions/setup-gradle@v6.1.1
        with:
          gradle-version: '9.3.1'

      - name: Aceptar licencias Android SDK (defensivo)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Flutter (stable + cache pub)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sincronizar fuente (app_source -> voice_bubble_stt)
        run: |
          cp app_source/pubspec.yaml app_source/analysis_options.yaml voice_bubble_stt/
          rm -rf voice_bubble_stt/lib voice_bubble_stt/test
          cp -r app_source/lib voice_bubble_stt/
          cp -r app_source/test voice_bubble_stt/

      - name: Pub get
        working-directory: voice_bubble_stt
        run: flutter pub get

      - name: Preparar local.properties para Gradle
        run: |
          flutter_sdk="${FLUTTER_ROOT:-$(cd "$(dirname "$(command -v flutter)")/.." && pwd)}"
          test -x "$flutter_sdk/bin/flutter" || { echo '::error::Flutter SDK no encontrado'; exit 1; }
          test -n "$ANDROID_HOME" || { echo '::error::ANDROID_HOME no definido'; exit 1; }
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$flutter_sdk" \
            > voice_bubble_stt/android/local.properties

      - name: Test Kotlin nativo del historial C-02
        working-directory: voice_bubble_stt/android
        run: |
          gradle --no-daemon :app:testDebugUnitTest --tests com.royleguiza.voicebubblestt.TranscriptionHistoryLogicTest

      - name: Test Kotlin nativo del widget de notas C-04
        working-directory: voice_bubble_stt/android
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.royleguiza.voicebubblestt.WidgetNotesBehaviorTest

      - name: Test Kotlin nativo de exclusion mutua del microfono C-05
        working-directory: voice_bubble_stt/android
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.royleguiza.voicebubblestt.MicrophoneClaimTest

      - name: Analyze estricto (infos y warnings fatales)
        working-directory: voice_bubble_stt
        run: flutter analyze

      - name: Test
        working-directory: voice_bubble_stt
        run: flutter test

      - name: Guard archivos de teclado presentes
        run: |
          test -f voice_bubble_stt/android/app/src/main/res/xml/method.xml \
            || { echo '::error::falta method.xml'; exit 1; }
          grep -q 'VoiceKeyboardService' voice_bubble_stt/android/app/src/main/AndroidManifest.xml \
            || { echo '::error::IME no declarado en manifest'; exit 1; }
          test -f voice_bubble_stt/android/app/src/main/kotlin/com/royleguiza/voicebubblestt/SpeechToTextClient.kt \
            || { echo '::error::falta SpeechToTextClient.kt (K3)'; exit 1; }

      - name: Build APK debug (split por ABI)
        working-directory: voice_bubble_stt
        # build-number = run_number: cada APK sale con versionCode superior
        # al anterior para que Android lo trate como ACTUALIZACIÓN (conserva
        # notas, snippets, clipboard, historial y ajustes) en vez de
        # reinstalación de la misma versión. La firma ya es estable
        # (debug.keystore versionado en android/app).
        run: flutter build apk --debug --split-per-abi --build-number=${{ github.run_number }}

      - name: Upload APK arm64
        uses: actions/upload-artifact@v4
        with:
          name: voice-bubble-arm64-debug-apk-r${{ github.run_number }}
          path: voice_bubble_stt/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
