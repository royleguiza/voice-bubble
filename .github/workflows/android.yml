name: Android Debug APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17 (con cache de Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Aceptar licencias Android SDK (defensivo)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Flutter (stable + cache pub)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold del proyecto (solo si falta)
        run: |
          if [ ! -d voice_bubble_stt/android ]; then
            flutter create voice_bubble_stt \
              --platforms android \
              --org com.royleguiza \
              --project-name voice_bubble_stt

            cp app_source/pubspec.yaml voice_bubble_stt/pubspec.yaml
            cp app_source/analysis_options.yaml voice_bubble_stt/analysis_options.yaml
            rm -rf voice_bubble_stt/lib voice_bubble_stt/test
            cp -r app_source/lib voice_bubble_stt/
            cp -r app_source/test voice_bubble_stt/

            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 28/' \
              voice_bubble_stt/android/app/build.gradle.kts
            grep -q 'minSdk = 28' voice_bubble_stt/android/app/build.gradle.kts \
              || { echo '::error::sed minSdk no aplicado'; exit 1; }

            sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <application|' \
              voice_bubble_stt/android/app/src/main/AndroidManifest.xml
            grep -q 'RECORD_AUDIO' voice_bubble_stt/android/app/src/main/AndroidManifest.xml \
              || { echo '::error::permiso RECORD_AUDIO no insertado'; exit 1; }
            grep -q 'INTERNET' voice_bubble_stt/android/app/src/main/AndroidManifest.xml \
              || { echo '::error::permiso INTERNET no insertado'; exit 1; }

            sed -i 's|android:label="voice_bubble_stt"|android:label="VoiceBubble STT"|' \
              voice_bubble_stt/android/app/src/main/AndroidManifest.xml
            grep -q 'VoiceBubble STT' voice_bubble_stt/android/app/src/main/AndroidManifest.xml \
              || { echo '::error::sed label no aplicado'; exit 1; }

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add voice_bubble_stt
            if git diff --cached --quiet; then
              echo "Sin cambios que commitear"
            else
              git commit -m "Hito 0: scaffold Flutter generado por CI"
              git pull --rebase origin main
              git push
            fi
          fi

      - name: Sincronizar fuente (app_source -> voice_bubble_stt)
        run: |
          cp app_source/pubspec.yaml app_source/analysis_options.yaml voice_bubble_stt/
          rm -rf voice_bubble_stt/lib voice_bubble_stt/test
          cp -r app_source/lib voice_bubble_stt/
          cp -r app_source/test voice_bubble_stt/

      - name: Pub get
        working-directory: voice_bubble_stt
        run: flutter pub get

      - name: Analyze estricto (infos y warnings fatales)
        working-directory: voice_bubble_stt
        run: flutter analyze

      - name: Test
        working-directory: voice_bubble_stt
        run: flutter test

      - name: Guard archivos de teclado presentes
        run: |
          test -f voice_bubble_stt/android/app/src/main/res/xml/method.xml \
            || { echo '::error::falta method.xml'; exit 1; }
          grep -q 'VoiceKeyboardService' voice_bubble_stt/android/app/src/main/AndroidManifest.xml \
            || { echo '::error::IME no declarado en manifest'; exit 1; }

      - name: Build APK debug
        working-directory: voice_bubble_stt
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-bubble-debug-apk-r${{ github.run_number }}
          path: voice_bubble_stt/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
