name: Release AAB (Play)

# T3 · Compilación de publicación firmada. Se dispara con un tag v* (por
# ejemplo v1.0.0) o a mano. Arma el AAB de Orison y el del Puntero firmados
# con la clave de SUBIDA (Play guarda la clave final con «Firma de apps de
# Play»), los valida con bundletool, comprueba la alineación de 16 KB y sube
# los dos AAB y un APK universal de prueba como artefactos.
#
# Secretos necesarios (Settings › Secrets and variables › Actions):
#   KEYSTORE_BASE64   upload-keystore.jks en base64 (una línea)
#   KEYSTORE_PASSWORD contraseña del almacén
#   KEY_ALIAS         alias de la clave (upload)
#   KEY_PASSWORD      contraseña de la clave
# El APK de prueba de cada push (android.yml) no cambia.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUNDLETOOL_VERSION: '1.18.1'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Secretos de firma presentes
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::falta el secreto $v"; exit 1; fi
          done

      - name: Clave de subida a un archivo temporal
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.3.1 reproducible
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
        with:
          gradle-version: '9.3.1'

      - name: Flutter (stable + cache pub)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Sincronizar fuente (app_source -> voice_bubble_stt)
        run: |
          cp app_source/pubspec.yaml app_source/pubspec.lock app_source/analysis_options.yaml app_source/l10n.yaml voice_bubble_stt/
          rm -rf voice_bubble_stt/lib voice_bubble_stt/test voice_bubble_stt/fonts
          cp -r app_source/lib voice_bubble_stt/
          cp -r app_source/test voice_bubble_stt/
          cp -r app_source/fonts voice_bubble_stt/

      - name: Pub get
        working-directory: voice_bubble_stt
        run: flutter pub get --enforce-lockfile

      - name: AAB de Orison (release)
        working-directory: voice_bubble_stt
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: AAB del Puntero (release)
        working-directory: puntero_android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:bundleRelease -PbuildNumber=${{ github.run_number }}

      - name: Validar con bundletool, firma y 16 KB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          curl -sSL -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          python3 tools/release/check_aab.py \
            --bundletool "$RUNNER_TEMP/bundletool.jar" \
            --keystore "$KEYSTORE_FILE" \
            --out "$RUNNER_TEMP/out" \
            voice_bubble_stt/build/app/outputs/bundle/release/app-release.aab \
            puntero_android/app/build/outputs/bundle/release/app-release.aab

      - name: Subir AAB de Orison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orison-release-aab-r${{ github.run_number }}
          path: voice_bubble_stt/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Subir AAB del Puntero
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orison-puntero-release-aab-r${{ github.run_number }}
          path: puntero_android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Subir APK universal de prueba (sacado del AAB)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orison-release-universal-apk-r${{ github.run_number }}
          path: ${{ runner.temp }}/out/app-release-1/universal.apk
          if-no-files-found: error
          retention-days: 14

      - name: Borrar la clave temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
