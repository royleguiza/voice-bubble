include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Warnings como errores: `flutter analyze` (CI, sin --no-fatal-*) ya es
    # fatal en warnings; esto lo hace explícito para la deuda que hoy pasa.
    invalid_annotation_target: error
    missing_required_param: error
    missing_return: error
    dead_code: error
    # `as` duros y tipos crudos ya son error vía strict-* arriba.
  exclude:
    - build/**

linter:
  rules:
    avoid_print: true
    unawaited_futures: true
    await_only_futures: true
    avoid_void_async: true
    cancel_subscriptions: true
    close_sinks: true
