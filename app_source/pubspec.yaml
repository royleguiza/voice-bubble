name: voice_bubble_stt
description: "VoiceBubble STT – Transcripción de voz a texto con burbuja flotante"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  record: ^7.1.1
  http: ^1.2.1
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  flutter_secure_storage: ^9.0.0
  # Reproducción del WAV conservado en la nota (pedido del dueño
  # 2026-09-23). Solo playback local de archivos propios, sin red.
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
