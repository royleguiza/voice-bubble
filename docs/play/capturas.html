<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Orison · marco de capturas</title>
<!-- T17: marco Horizonte para las capturas de Play (1080 × 1920). Uso:
     capturas.html?img=capturas/1.png&t=Dictá%20en%20cualquier%20app
     y exportar #frame con Playwright (tools/release/framed_shots.js). -->
<style>
  @font-face { font-family: Sora; src: url(../../app_source/fonts/Sora-Bold.ttf); font-weight: 700; }
  html, body { margin: 0; background: #0B0C12; }
  #frame { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(110% 60% at 50% 100%, #2a1606 0%, #0B0C12 60%); }
  h1 { position: absolute; left: 80px; right: 80px; top: 120px; margin: 0; text-align: center;
    font: 700 76px/1.12 Sora, sans-serif; letter-spacing: -.01em; color: #F2F0EC; }
  h1 b { color: #FF8A1F; font-weight: 700; }
  .phone { position: absolute; left: 50%; top: 400px; transform: translateX(-50%); width: 760px; height: 1600px;
    border-radius: 64px; background: #000; padding: 18px; box-shadow: 0 0 0 4px #262A38, 0 40px 120px rgba(255,138,31,.18); }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 48px; display: block; }
</style>
</head>
<body>
<div id="frame">
  <h1 id="t"></h1>
  <div class="phone"><img id="img" alt=""></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('img').src = q.get('img') || '';
  // «*palabra*» en brasa.
  document.getElementById('t').innerHTML = (q.get('t') || '').replace(/\*(.+?)\*/g, '<b>$1</b>');
</script>
</body>
</html>
