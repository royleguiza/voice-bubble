<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceBubble - Laboratorio UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>
    <style>
        .phone-frame { width: 340px; height: 720px; border-radius: 48px; border: 14px solid #1a1a1a; position: relative; overflow: hidden; background: #f3f4f6; box-shadow: 0 30px 60px -15px rgba(0,0,0,0.3); margin-top: 10px; }
        .dark .phone-frame { background: #0b1120; border-color: #050505; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        .glass-header { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 h-screen overflow-hidden font-sans">
    <div id="app" class="flex h-full w-full">
        
        <!-- Sidebar Menu -->
        <aside class="w-80 bg-white border-r border-gray-200 h-full flex flex-col shadow-xl z-20" aria-label="Panel de navegación">
            <div class="p-6 border-b border-gray-200 bg-gradient-to-br from-blue-50 to-blue-100">
                <h1 class="text-2xl font-black text-blue-800 tracking-tight">VoiceBubble</h1>
                <p class="text-xs font-bold text-blue-500 uppercase tracking-widest mt-1">Laboratorio de Diseño UI</p>
            </div>
            <div class="flex-1 overflow-y-auto p-3 space-y-1" role="navigation" aria-label="Menú de características">
                <button 
                    v-for="feat in features" :key="feat.id"
                    @click="activeFeature = feat"
                    :aria-label="'Seleccionar ' + feat.name"
                    :aria-current="activeFeature.id === feat.id ? 'true' : undefined"
                    :class="['w-full text-left px-4 py-3 rounded-xl transition-all duration-200 text-sm font-semibold flex items-center', activeFeature.id === feat.id ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'text-gray-600 hover:bg-gray-100']"
                >
                    <span class="mr-3 text-lg opacity-70" v-if="activeFeature.id !== feat.id">✦</span>
                    <span class="mr-3 text-lg" v-else>🚀</span>
                    {{ feat.name }}
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 h-full overflow-y-auto bg-[#f8fafc] relative" role="main" aria-label="Contenido principal del laboratorio">
            
            <header class="sticky top-0 z-10 glass-header border-b border-gray-200 px-10 py-6 flex flex-col gap-1">
                <h2 class="text-3xl font-black text-gray-800">{{ activeFeature.name }}</h2>
                <p class="text-gray-500 font-medium">Comparativa de implementaciones en dispositivos móviles (Modo Claro vs Modo Oscuro).</p>
            </header>

            <div class="p-10 space-y-16">
                
                <section v-for="variant in activeFeature.variants" :key="variant.id" class="bg-white rounded-[2.5rem] p-10 shadow-sm border border-gray-200" :aria-label="'Variante ' + variant.id + ': ' + variant.name">
                    <h3 class="text-2xl font-bold text-gray-800 mb-10 pb-5 border-b border-gray-100 flex items-center">
                        <span class="bg-blue-100 text-blue-700 px-4 py-1.5 rounded-xl mr-4 text-sm tracking-wide shadow-sm border border-blue-200">{{ variant.id }}</span> 
                        {{ variant.name }}
                    </h3>
                    
                    <div class="flex flex-wrap justify-center gap-20" role="group" aria-label="Comparativa de modos claro y oscuro">
                        
                        <!-- Modo Claro -->
                        <div class="flex flex-col items-center">
                            <div class="mb-5 px-6 py-2 bg-gray-100 rounded-full font-bold text-gray-600 uppercase tracking-widest text-xs shadow-inner">☀️ Modo Claro</div>
                            <div class="phone-frame ring-1 ring-gray-300" role="img" aria-label="Vista previa en modo claro">
                                <!-- Base App Background -->
                                <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>
                                <div class="absolute inset-0 z-10" v-html="variant.html"></div>
                            </div>
                        </div>

                        <!-- Modo Oscuro -->
                        <div class="flex flex-col items-center">
                            <div class="mb-5 px-6 py-2 bg-gray-900 text-gray-300 rounded-full font-bold uppercase tracking-widest text-xs shadow-inner">🌙 Modo Oscuro</div>
                            <div class="dark phone-frame ring-1 ring-gray-950 shadow-2xl" role="img" aria-label="Vista previa en modo oscuro">
                                <!-- Base App Background Dark -->
                                <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-30"></div>
                                <div class="absolute inset-0 z-10" v-html="variant.html"></div>
                            </div>
                        </div>

                    </div>
                </section>

            </div>
            
        </main>
    </div>
